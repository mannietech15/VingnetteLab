<svg width="100%" viewBox="0 0 680 669.05" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Animated glass pen illustration</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A translucent glass pen with a teal-to-violet gradient glow, a dark cap, and a pulsing glowing lightning bolt emblem, gently floating with a shimmering highlight, isolated with no background.</desc>
<defs>
<linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#173a3f" stop-opacity="0.55"/>
<stop offset="35%" stop-color="#1b3a63" stop-opacity="0.55"/>
<stop offset="70%" stop-color="#2c2560" stop-opacity="0.6"/>
<stop offset="100%" stop-color="#1a1030" stop-opacity="0.7"/>
</linearGradient>
<linearGradient id="glowEdge" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#38e6c9" stop-opacity="0.85"/>
<stop offset="50%" stop-color="#38e6c9" stop-opacity="0.15"/>
<stop offset="100%" stop-color="#38e6c9" stop-opacity="0"/>
</linearGradient>
<linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#eafcff"/>
<stop offset="55%" stop-color="#8fe9ff"/>
<stop offset="100%" stop-color="#3fd0e0"/>
</linearGradient>
<linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#3a2f66"/>
<stop offset="100%" stop-color="#171034"/>
</linearGradient>
<radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#3fe6c9" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#3fe6c9" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="bodyClip">
<path d="M296 172 L384 172 L400 430 Q340 460 280 430 Z"/>
</clipPath>
</defs>



